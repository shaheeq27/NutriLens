[project]
name = "nutrilens-backend"
version = "0.1.0"
description = "NutriLens backend — FastAPI service for the food-scan API."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "httpx>=0.27",
    "openai>=1.0",
    "google-cloud-vision>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
